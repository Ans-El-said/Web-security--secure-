<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Portal Login</h1>

{% if message %}
<p>{{ message }}</p>
{% endif %}

<form method="POST">

    <label>Username:</label>
    <input type="text" name="username">
    <br><br>

    <label>Password:</label>
    <input type="password" name="password">
    <br><br>

    <button type="submit">Login</button>

</form>

<br>

<a href="/register">Create an account</a>

</body>
</html>
